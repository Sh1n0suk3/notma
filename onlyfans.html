<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Ma's OnlyFans</title>
    <meta property="og:title" content="OnlyFans">
    <meta property="og:description" content="">
    <meta property="og:image" content="https://static2.onlyfans.com/static/prod/f/202506171530-7f98e4fc26/images/of-logo-b.jpg">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/x-icon" href="img/onlyfans.ico">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            font-family: sans-serif;
            background-color: #000;
        }
        #loader {
            color: #fff;
            font-size: 1.5rem;
            line-height: 2rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            cursor: pointer;
            transition: opacity 0.3s ease-in-out;
        }
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #video-container iframe {
            width: 100%;
            height: 100%;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loader">
        <span>Redirecting...</span>
    </div>

    <div id="video-container" class="hidden">
        <iframe
            src="https://player.vimeo.com/video/198511874?autoplay=1&loop=1&title=0&byline=0&portrait=0&autopause=0"
            frameborder="0"
            allow="autoplay; fullscreen"
            allowfullscreen
            title="Test Video"
        ></iframe>
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        const loader = document.getElementById('loader');
        const loaderText = loader.querySelector('span');
        const videoContainer = document.getElementById('video-container');
        const iframe = videoContainer.querySelector('iframe');
        const player = new Vimeo.Player(iframe);

        player.on('play', () => {
            loader.classList.add('hidden');
        });

        player.on('error', (error) => {
            console.error('Vimeo Player Error:', error);
            loaderText.textContent = 'Failed to load video.';
        });

        player.ready().then(() => {
            videoContainer.classList.remove('hidden');
            return player.play();
        }).catch(error => {
            if (error.name === 'NotAllowedError') {
                console.warn('Autoplay was blocked. Waiting for user interaction.');
                loaderText.textContent = 'Click to Play';
                document.body.addEventListener('click', () => {
                    player.play();
                }, { once: true });
            } else {
                // The error you are seeing is being caught here.
                // Check the console to see the specific 'error' object.
                console.error('An error occurred while trying to play the video:', error);
                loaderText.textContent = 'Could not play video.';
            }
        });
    </script>
</body>
</html>
